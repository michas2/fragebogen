<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fragebogen</title>
<style>
body { font-family: Georgia, serif; max-width: 800px; margin: 0 auto; padding: 20px; line-height: 1.6; }
h1 { text-align: center; }
h2 { border-bottom: 2px solid #333; padding-bottom: 5px; margin-top: 2em; }
.description { color: #555; font-style: italic; margin-bottom: 1.5em; }
.question { margin-bottom: 1.5em; }
.question label { display: block; font-weight: bold; margin-bottom: 5px; }
.question input[type="text"], .question textarea { width: 100%; padding: 8px; font-size: 1em; border: 1px solid #999; border-radius: 3px; box-sizing: border-box; }
.question textarea { height: 120px; resize: vertical; }
.choice-group { display: flex; gap: 1.5em; flex-wrap: wrap; margin-top: 5px; }
.choice-group label { font-weight: normal; display: flex; align-items: center; gap: 5px; }
button { display: block; margin: 2em auto; padding: 12px 30px; font-size: 1.1em; background: #2a6; color: white; border: none; border-radius: 5px; cursor: pointer; }
button:hover { background: #185; }
.saved-notice { text-align: center; color: #2a6; opacity: 0; transition: opacity 0.3s; }
.error-notice { text-align: center; color: #b00; background: #fdd; border: 1px solid #b00; border-radius: 4px; padding: 10px; }
.clear-choice { background: none; border: none; color: #06c; cursor: pointer; font: inherit; font-size: 0.85em; padding: 0; margin: 4px 0 0 0; display: inline; text-decoration: underline; }
.clear-choice:hover { color: #04a; background: none; }
.selector { text-align: center; margin-bottom: 1em; }
.selector label { font-weight: bold; margin-right: 8px; }
.selector select { padding: 6px 10px; font-size: 1em; border: 1px solid #999; border-radius: 3px; }
</style>
</head>
<body>
<div class="selector">
  <label for="questionnaire">Fragebogen:</label>
  <select id="questionnaire"></select>
</div>
<p class="error-notice" id="error" role="alert" hidden></p>
<h1 id="title"></h1>
<div id="form"></div>
<button onclick="exportPDF()">PDF exportieren</button>
<p class="saved-notice" id="saved">✓ Gespeichert</p>

<script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/vfs_fonts.js"></script>
<script>
let data;

// Questionnaires live in questions/. To add one, drop the YAML there
// and list its filename in questions/index.json.
const QUESTIONS_DIR = 'questions/';
const MANIFEST = QUESTIONS_DIR + 'index.json';
const LAST_KEY = 'fragebogen_last_file';
const ANSWERS_PREFIX = 'fragebogen_answers::';
let currentFile = null;

// Per-questionnaire storage key so answers don't mix between files.
function storageKey() {
  return ANSWERS_PREFIX + currentFile;
}

// Escape text for safe interpolation into HTML.
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Safely escape a value for use in a CSS attribute/id selector.
function cssEscape(s) {
  return (window.CSS && CSS.escape) ? CSS.escape(String(s)) : String(s).replace(/["\\\]]/g, '\\$&');
}

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = msg;
  el.hidden = false;
}

function clearError() {
  const el = document.getElementById('error');
  el.hidden = true;
  el.textContent = '';
}

// Remove stored answers for questionnaires no longer in the manifest.
function pruneOrphanAnswers(validFiles) {
  const valid = new Set(validFiles.map(f => ANSWERS_PREFIX + f));
  for (let i = localStorage.length - 1; i >= 0; i--) {
    const key = localStorage.key(i);
    if (key && key.startsWith(ANSWERS_PREFIX) && !valid.has(key)) {
      localStorage.removeItem(key);
    }
  }
}

async function init() {
  const select = document.getElementById('questionnaire');

  let files;
  try {
    const res = await fetch(MANIFEST);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    files = await res.json();
    if (!Array.isArray(files) || files.length === 0) throw new Error('leere oder ungültige Liste');
  } catch (e) {
    showError('Fragebogen-Liste konnte nicht geladen werden (' + MANIFEST + '): ' + e.message);
    return;
  }

  pruneOrphanAnswers(files);

  // Load the manifest, then read each file's own title for the label.
  const entries = await Promise.all(files.map(async file => {
    try {
      const res = await fetch(QUESTIONS_DIR + file);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const doc = jsyaml.load(await res.text());
      return { file, label: (doc && doc.title) || file };
    } catch (e) {
      return { file, label: file + ' (Fehler beim Laden)' };
    }
  }));

  for (const { file, label } of entries) {
    const opt = document.createElement('option');
    opt.value = file;
    opt.textContent = label;
    select.appendChild(opt);
  }

  currentFile = entries[0] && entries[0].file;
  const last = localStorage.getItem(LAST_KEY);
  if (last && entries.some(e => e.file === last)) currentFile = last;
  select.value = currentFile;
  select.addEventListener('change', () => {
    currentFile = select.value;
    localStorage.setItem(LAST_KEY, currentFile);
    loadQuestionnaire();
  });

  await loadQuestionnaire();
}

async function loadQuestionnaire() {
  clearError();
  localStorage.setItem(LAST_KEY, currentFile);
  const form = document.getElementById('form');
  try {
    const res = await fetch(QUESTIONS_DIR + currentFile);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = jsyaml.load(await res.text());
  } catch (e) {
    form.innerHTML = '';
    document.getElementById('title').textContent = '';
    showError('Fragebogen konnte nicht geladen werden (' + currentFile + '): ' + e.message);
    return;
  }

  document.getElementById('title').textContent = data.title || currentFile;

  // Warn about duplicate ids (they would cross-wire answers).
  const seen = new Set();
  for (const s of data.sections || []) {
    for (const q of s.questions || []) {
      if (seen.has(q.id)) console.warn('Doppelte Frage-ID:', q.id);
      seen.add(q.id);
    }
  }

  // Build markup once, then assign (avoids repeated reparsing).
  let html = '';
  for (const section of data.sections || []) {
    html += `<h2>${escapeHtml(section.title)}</h2>`;
    if (section.description) html += `<p class="description">${escapeHtml(section.description)}</p>`;
    for (const q of section.questions || []) {
      html += renderQuestion(q);
    }
  }
  form.innerHTML = html;

  loadAnswers();
  form.oninput = saveAnswers;
  // Deselect a radio by clicking the already-selected one (mouse).
  form.onclick = e => {
    if (e.target.classList && e.target.classList.contains('clear-choice')) {
      e.preventDefault();
      const name = e.target.dataset.for;
      const checked = form.querySelector(`input[name="${cssEscape(name)}"]:checked`);
      if (checked) { checked.checked = false; saveAnswers(); }
      return;
    }
    if (e.target.type === 'radio' && e.target.dataset.wasChecked === 'true') {
      e.target.checked = false;
      e.target.dataset.wasChecked = 'false';
      saveAnswers();
    }
  };
  form.onmousedown = e => {
    if (e.target.type === 'radio') {
      e.target.dataset.wasChecked = e.target.checked ? 'true' : 'false';
    }
  };
}

function renderQuestion(q) {
  const id = escapeHtml(q.id);
  let input;
  if (q.type === 'textarea') {
    input = `<textarea id="${id}"></textarea>`;
  } else if (q.type === 'yesno') {
    input = choiceGroup(q.id, ['Ja', 'Nein']);
  } else if (q.type === 'choice') {
    input = choiceGroup(q.id, q.options || []);
  } else {
    if (q.type !== 'text') console.warn('Unbekannter Fragetyp "' + q.type + '" für', q.id, '– verwende Textfeld.');
    input = `<input type="text" id="${id}">`;
  }
  return `<div class="question"><label for="${id}">${escapeHtml(q.text)}</label>${input}</div>`;
}

function choiceGroup(name, options) {
  const nameEsc = escapeHtml(name);
  const opts = options.map(o =>
    `<label><input type="radio" name="${nameEsc}" value="${escapeHtml(o)}"> ${escapeHtml(o)}</label>`
  ).join('');
  return `<div class="choice-group">${opts}</div>` +
    `<button type="button" class="clear-choice" data-for="${nameEsc}">Auswahl löschen</button>`;
}

function saveAnswers() {
  const answers = {};
  for (const s of data.sections || []) for (const q of s.questions || []) {
    if (q.type === 'choice' || q.type === 'yesno') {
      const checked = document.querySelector(`input[name="${cssEscape(q.id)}"]:checked`);
      answers[q.id] = checked ? checked.value : '';
    } else {
      const el = document.getElementById(q.id);
      answers[q.id] = el ? el.value : '';
    }
  }
  localStorage.setItem(storageKey(), JSON.stringify(answers));
  const notice = document.getElementById('saved');
  notice.style.opacity = 1;
  setTimeout(() => notice.style.opacity = 0, 1500);
}

function loadAnswers() {
  const answers = JSON.parse(localStorage.getItem(storageKey()) || '{}');
  for (const [id, val] of Object.entries(answers)) {
    const el = document.getElementById(id);
    if (el) { el.value = val; }
    else if (val) {
      const radio = document.querySelector(`input[name="${cssEscape(id)}"][value="${cssEscape(val)}"]`);
      if (radio) radio.checked = true;
    }
  }
}

function exportPDF() {
  const answers = JSON.parse(localStorage.getItem(storageKey()) || '{}');
  const content = [{ text: data.title, style: 'title' }];

  function checkbox(checked) {
    const box = {
      canvas: [{ type: 'rect', x: 0, y: 0, w: 10, h: 10, lineWidth: 1, lineColor: '#333' }],
      width: 14
    };
    if (checked) {
      box.canvas.push({ type: 'line', x1: 2, y1: 5, x2: 4.5, y2: 8, lineWidth: 1.5, lineColor: '#333' });
      box.canvas.push({ type: 'line', x1: 4.5, y1: 8, x2: 9, y2: 2, lineWidth: 1.5, lineColor: '#333' });
    }
    return box;
  }

  function optionRow(options, selected) {
    const cols = [];
    for (const o of options) {
      cols.push(checkbox(o === selected));
      cols.push({ text: o + '   ', style: 'answer', margin: [2, 0, 10, 0] });
    }
    return { columns: cols, margin: [10, 2, 0, 5] };
  }

  for (const section of data.sections || []) {
    content.push({ text: section.title, style: 'h2', pageBreak: 'before' });
    if (section.description) content.push({ text: section.description, style: 'desc' });
    for (const q of section.questions || []) {
      const questionBlock = [{ text: q.text, style: 'question' }];
      if (q.type === 'yesno') {
        questionBlock.push(optionRow(['Ja', 'Nein'], answers[q.id]));
      } else if (q.type === 'choice') {
        questionBlock.push(optionRow(q.options || [], answers[q.id]));
      } else {
        questionBlock.push({ text: answers[q.id] || '—', style: 'answer' });
      }
      content.push({ unbreakable: true, stack: questionBlock });
    }
  }
  const pdfName = (currentFile || 'fragebogen').replace(/\.ya?ml$/i, '') + '.pdf';
  pdfMake.createPdf({
    content,
    styles: {
      title: { fontSize: 18, bold: true, alignment: 'center', margin: [0, 0, 0, 20] },
      h2: { fontSize: 14, bold: true, margin: [0, 20, 0, 5] },
      desc: { fontSize: 10, italics: true, color: '#555', margin: [0, 0, 0, 10] },
      question: { fontSize: 11, bold: true, margin: [0, 8, 0, 2] },
      answer: { fontSize: 11, margin: [10, 0, 0, 5] }
    }
  }).download(pdfName);
}

init();
</script>
</body>
</html>
