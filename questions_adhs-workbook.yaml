title: ADHS Workbook (Christian Kissler) – Selbstreflexion zur Diagnostik-Vorbereitung
sections:
- id: einleitung
  title: 'Kapitel 1: Einleitung und Anleitung zur Arbeit mit diesem Buch'
  description: 'Bei der Aufmerksamkeitsdefizit-/ Hyperaktivitätsstörung (ADHS) handelt es sich um eine neuronale Entwicklungsstörung, die den Alltag massiv prägen kann. Daher setzt eine Diagnostik im Kontext von ADHS eine fundierte sowie umfassende Sammlung von Informationen über die jeweilige Person voraus: Neben dem Verhalten müssen auch das innere Erleben und der individuelle Werdegang detailliert betrachtet werden. Also ist nicht bloß die aktuelle Situation zu analysieren, sondern die Vergangenheit ebenfalls zu berücksichtigen. Insbesondere gilt es, zu untersuchen, inwieweit mögliche ADHS-Symptome welche Lebensbereiche beeinflussen. Nur so kann eingeschätzt werden, ob ggf. Nachteilsausgleiche oder andere Hilfen notwendig sind.


    Das Ziel dieses Workbooks ist es, Ihnen bei der Reflexion über die eigenen Auffälligkeiten zu helfen. Eine intensive Auseinandersetzung mit sich selbst stellt einen sinnvollen Schritt dar: So kann man Worte für das finden, was einen beschäftigt. Die eigenen Gedanken systematisch aufzuschreiben, fällt aber vielen Menschen mit ADHS schwer (z. B. wegen Defiziten in den exekutiven Funktionen). Daher möchte dieses Buch Sie dabei unterstützen, aussagekräftige Unterlagen über Ihren bisherigen Lebenslauf, Ihre Person, Ihr Empfinden sowie Ihre Verhaltensweisen und Ihre Wahrnehmung zu erstellen. Dies soll Sie auch auf Fragen vorbereiten, wie sie z. B. im Rahmen einer Diagnostik typischerweise vorkommen.


    Ein (Diagnostik-)Gespräch ist allerdings soziale Interaktion und soziale Interaktion stellt für viele Menschen mit ADHS eine Herausforderung dar (beispielsweise wegen Defiziten in der Impulskontrolle oder Konzentrationsschwierigkeiten). Deshalb erscheint es nur logisch, wenn Sie ein Hilfsmittel wie das von Ihnen ausgefüllte Workbook mit sich führen möchten. Sie können es dann als „Spicker“ verwenden, damit Sie alles erwähnen, was die andere Person wissen sollte. Was spricht auch gegen eine Gedankenstütze? Immerhin ist eine Evaluation Ihrer Auffälligkeiten kein Wissenstest und Zerstreutheit ist sogar ein mögliches Merkmal von ADHS.


    Außerdem können Sie das ausgefüllte Buch an Gesprächspartner:innen aushändigen oder z. B. bei einer Diagnostikstelle einreichen (ebenso wie andere Notizen oder Dokumente). Manchmal hilft es, Informationen sowohl mündlich mitzuteilen als auch schriftlich bereitzustellen; dies kann Missverständnisse reduzieren und Gedächtnislücken schließen. Sie können das Buch aber auch nur für sich selbst nutzen. Niemand hat das Recht, Ihre Notizen zu lesen, wenn Sie dies nicht möchten.


    Dieses Workbook wurde so verfasst, dass Sie es nicht „an einem Stück“ durcharbeiten müssen. Sie können es jederzeit weglegen und die Bearbeitung zu einem beliebigen Zeitpunkt fortsetzen. Der Aufbau des Buches folgt einem einheitlichen Muster: Die Fragen sind thematisch sortiert (z. B. zu Ihrer Person oder zu spezifischen Verhaltensweisen) und zumeist sollen sie in einem ersten Schritt mit „Ja“ oder „Nein“ beantwortet werden. Erfahrungsgemäß regt dieses Antwortformat dazu an, vertiefend über den jeweiligen Aspekt nachzudenken. Ausweichantworten (wie „teilweise“ oder „manchmal“) werden regelmäßig zu rasch oder als „sicherer Hafen“ (Metapher) angekreuzt und verhindern intensive Reflexionsprozesse (z. B. Sturgis et al., 2014; Muñoz van den Eynde & Lobera, 2022) – doch uns geht es schließlich um ein vertieftes Nachdenken und Abwägen.


    Das dichotome Antwortformat (Ja/ Nein) soll Sie also nicht einengen, sondern unterstützen. Weil anzunehmen ist, dass Ihre eigentliche Antwort in vielen Fällen komplexer ausfallen wird, gibt es fast immer Platz für Anmerkungen. Dazu werden Ihnen Freitextbereiche zur Verfügung gestellt. Diese können Sie nutzen, um die Art der Fragestellung zu kritisieren oder zu erklären, warum Sie sich nicht eindeutig für „Ja“ oder „Nein“ entscheiden können. Alternativ können Sie Ihre individuellen Auffälligkeiten detaillierter beschreiben und an Beispielen deutlich machen. Selbstverständlich sind Sie nicht verpflichtet, diese Felder auszufüllen – das ist schließlich Ihr Buch.


    Wie Ihnen bei der Arbeit mit diesem Workbook gewiss auffallen wird: Die Fragen sind teilweise so formuliert, dass die Antwort „Ja“ mit Blick auf die Diagnosekriterien und/ oder die wissenschaftliche Evidenz als ein Indiz für ADHS interpretiert werden könnte. Allerdings sind nicht alle Fragen so ausgerichtet und es kann unterschiedliche Gründe für ein Ja/ Nein geben. Daher können Sie weder die Ja- noch die Nein-Antworten durchzählen, um einzuschätzen, ob bei Ihnen ein ADHS-Verdacht besteht. Dergleichen will dieses Buch aber auch gar nicht leisten. Im Fokus stehen die Informationssammlung sowie die Selbstreflexion. Eine medizinische/ therapeutische Diagnostik erfolgt hingegen durch die zuständigen Stellen. Denn das ist die Aufgabe von geschulten Fachpersonen, die ggf. anerkannte Testverfahren einsetzen und Fremdbeobachtungen durchführen.


    Falls Sie wissen möchten, weshalb bestimmte Aspekte in diesem Workbook thematisiert werden bzw. was spezifische Auffälligkeiten im Kontext von ADHS bedeuten, können Sie sich mithilfe von Fachliteratur vertiefend in das Thema einlesen. In Klassifikationssystemen wie dem DSM-5-TR (APA, 2022) oder der ICD-11 (WHO, 2025) sind grundlegende Beschreibungen von ADHS zu finden. Falls Sie ein Buch zum Thema kaufen möchten, achten Sie bitte darauf, dass es tatsächlich von einer Fachperson geschrieben wurde.


    Die Bedeutung von Selbstdiagnosen (als fundierte Vermutungen) wird hier ausgespart, kann jedoch andernorts nachgelesen werden, z. B. auf meiner Homepage: www.christian-kissler.de. Obzwar es dort vornehmlich um Autismus geht, lassen sich die Ausführungen auf ADHS sinngemäß übertragen. In jedem Fall gilt es, die Selbstdiagnose von der Selbstdeklaration zu unterscheiden.


    Um keine Missverständnisse aufkommen zu lassen: Dieses Buch ersetzt keine medizinische/ therapeutische Diagnostik und kann sowie will sie auch nicht durchführen. Es legt auch kein Diagnostik-Ergebnis nahe. Eine ausführliche und fundierte Sammlung von Unterlagen könnte jedoch eine Diagnostik (oder eine Pflegebegutachtung) für Sie erleichtern und dem Entstehen von Fehlern entgegenwirken: ähnlich wie etwa Tagebucheinträge/ Zeugnisse wichtige Informationen enthalten können. In der Hoffnung, anderen Menschen auf ihrem Weg zu helfen, wurde dieses Buch verfasst.


    An dieser Stelle möchte ich noch anmerken, dass es nicht „die eine Diagnostik“ gibt. Von der medizinischen Diagnostik wird z. B. die (pädagogische) Förderdiagnostik unterschieden. Letztere zielt darauf ab, Bedarfe und Potenziale zu identifizieren, und ist bei ADHS von hoher Relevanz – auch im Erwachsenenalter. Darüber hinaus ist eine Selbstdiagnostik etwas vollkommen Alltägliches. Wenn Sie einen Tagesplan erstellen, führt sogar kein Weg daran vorbei: Was liegt heute bei mir an? Welche Ressourcen habe ich zur Verfügung? Was sind zwingende To-dos und was kann später erledigt werden? Wie gehe ich am besten vor? Und was ist eigentlich mein persönliches Ziel? Somit ist jede Form der systematischen Selbstevaluation als Diagnostik zu verstehen. Es handelt sich um nichts anderes als eine Bestandsaufnahme inklusive Reflexion. Und bei diesem Prozess möchte das Buch Sie unterstützen.


    Bitte arbeiten Sie nur dann mit diesem Workbook, wenn Sie sich psychisch sowie emotional dazu in der Lage fühlen. Die Natur der Sache verlangt es, dass Sie auch über einige Aspekte reflektieren müssen, die höchstpersönliche Lebensbereiche betreffen. Bitte geben Sie daher das (ausgefüllte) Buch nur an Personen und Stellen weiter, denen Sie vertrauen – und passen Sie gut darauf auf. Gönnen Sie sich eine Pause, wenn Sie diese brauchen.


    Bei einigen Fragen werden Wörter wie „oft“, „regelmäßig“ oder „manchmal“ benutzt. Solche Adverbien/ Adjektive stehen für ein ungefähres Maß an Häufigkeit und werden nicht näher definiert; sie sollen bloß ausdrücken, in welche Richtung die Frage grob abzielt. Es obliegt Ihnen, in den Freitextfeldern genauer darzustellen, inwieweit die jeweiligen Auffälligkeiten bei Ihnen vorkommen.


    Der zum Schreiben bereitgestellte Platz könnte Ihnen zuweilen recht knapp erscheinen, doch diese Begrenzung ist Absicht. Es ist notwendig, dass Sie versuchen, möglichst präzise zu formulieren. Einerseits werden so Reflexionsprozesse angestoßen, andererseits neigen Diagnostiker:innen dazu, lange Texte lediglich zu überfliegen oder bei Ausschweifungen nicht richtig zuzuhören. Des Weiteren werden unübersichtliche „Spicker“ Ihnen in einer realen Situation nicht viel nützen.


    Bevor Sie mit dem Ausfüllen dieses Buches starten, möchte ich Ihnen noch einen kurzen Hinweis geben: Es bietet sich an, zunächst mit einem Bleistift zu arbeiten. Dann können Sie Fehler leichter korrigieren und Ergänzungen/ Umformulierungen sind unkompliziert möglich. Sobald Sie das Buch vollständig durchgearbeitet haben, können Sie Ihren Bleistifttext gerne mit Kugelschreiber nachziehen, damit er dokumentenecht wird.


    Anmerkung zur erweiterten Nutzung: Das Buch wurde so verfasst, dass sich die Fragen an Sie richten. Selbstverständlich können Sie dieses Workbook aber auch stellvertretend für eine andere Person ausfüllen: z. B., wenn diese (aus spezifischen Gründen; es gibt m. E. zahlreiche) dazu nicht selbst in der Lage ist. Sie müssen dann die Fragen entsprechend umdeuten bzw. die Perspektive wechseln. Unpassende Fragen sind ggf. auszulassen.'
  questions: []
- id: rahmeninformationen
  title: 'Kapitel 2: Allgemeine Rahmeninformationen'
  description: Im Folgenden geht es darum, dass Sie zentrale Rahmeninformationen zu Ihrer Person erfassen. Solche werden im Kontext einer Diagnostik in aller Regel erfragt. Die Notizen, die Sie in diesem Kapitel anfertigen, können Ihnen dann als „Spicker“ und Orientierungshilfe dienen.
  questions:
  - id: r1
    type: text
    text: 'Das ist Ihr Name (Vorname/ Vornamen und Nachname/ Nachnamen):'
  - id: r2
    type: text
    text: 'An diesem Tag wurden Sie geboren (Datum: Tag/ Monat/ Jahr):'
  - id: r3
    type: choice
    text: 'Das ist Ihr Geschlecht:'
    options:
    - weiblich
    - männlich
    - divers
    - unzutreffend
  - id: r4
    type: text
    text: 'In dieser Stadt wurden Sie geboren:'
  - id: r5
    type: text
    text: 'In diesem Land wurden Sie geboren:'
  - id: r6
    type: text
    text: 'Dies ist Ihre Muttersprache (die Sprache, die Sie zuerst erlernt haben):'
  - id: r7
    type: text
    text: 'Diese Sprachen wurden in Ihrer Kindheit bei Ihnen zu Hause gesprochen:'
  - id: r8
    type: textarea
    text: 'Diese Sprachen beherrschen Sie (gerne können Sie auch angeben, wie gut Sie welche Sprachen sprechen):'
  - id: r9
    type: textarea
    text: 'Hier können Sie Ihr Verhältnis zu Ihren Eltern in Ihrer <u>Kindheit</u> beschreiben:'
  - id: r10
    type: textarea
    text: 'Hier können Sie Ihr Verhältnis zu Ihren Eltern in Ihrer <u>Jugend</u> beschreiben:'
  - id: r11
    type: textarea
    text: 'Hier können Sie Ihr <u>heutiges</u> Verhältnis zu Ihren Eltern beschreiben (es genügt eine grobe Beschreibung; Präzisierungen erfolgen bei der nächsten Frage):'
  - id: r12
    type: yesno
    text: Haben Sie heutzutage noch Kontakt zu allen Elternteilen?
  - id: r13
    type: textarea
    text: 'Hier können Sie präzisieren, in welcher Beziehung Sie zu Ihren Elternteilen jeweils stehen (z. B., ob Sie aktuell Streit mit einem Elternteil haben oder ein Elternteil Sie im Alltag unterstützt):'
  - id: r14
    type: yesno
    text: Haben Sie Geschwister?
  - id: r15
    type: text
    text: 'Falls „Ja“, Nachfrage 1: Wie viele Geschwister haben Sie?'
  - id: r16
    type: textarea
    text: 'Falls „Ja“, Nachfrage 2: Sind Ihre Geschwister jünger oder älter als Sie?'
  - id: r17
    type: textarea
    text: Wie ist Ihr Verhältnis zu Ihren Geschwistern heute/ wie war das Verhältnis früher?
  - id: r18
    type: yesno
    text: Hatten Sie in Ihrer <u>Kindheit</u> Freund:innen?
  - id: r19
    type: yesno
    text: Wollten Sie in Ihrer <u>Kindheit</u> Freund:innen haben?
  - id: r20
    type: textarea
    text: 'Hier können Sie Anmerkungen zu Ihren Freundschaften in Ihrer <u>Kindheit</u> verfassen:'
  - id: r21
    type: yesno
    text: Hatten Sie in Ihrer <u>Jugend</u> Freund:innen?
  - id: r22
    type: yesno
    text: Wollten Sie in Ihrer <u>Jugend</u> Freund:innen haben?
  - id: r23
    type: textarea
    text: 'Hier können Sie Anmerkungen zu Ihren Freundschaften in Ihrer <u>Jugend</u> verfassen:'
  - id: r24
    type: yesno
    text: Haben Sie <u>heutzutage</u> Freund:innen?
  - id: r25
    type: yesno
    text: Wollen Sie <u>heutzutage</u> Freund:innen haben?
  - id: r26
    type: textarea
    text: 'Hier können Sie Anmerkungen zu Ihren <u>heutigen</u> Freundschaften verfassen:'
  - id: r27
    type: yesno
    text: Wurden bei Ihnen bereits Störungen/ Krankheiten diagnostiziert?
  - id: r28
    type: textarea
    text: 'Hier können Sie zusammenfassen, welche Krankheiten/ Störungen bei Ihnen bereits diagnostiziert wurden:'
  - id: r29
    type: yesno
    text: Vermuten Sie weitere Störungen/ Krankheiten bei sich, die bisher nicht diagnostiziert wurden?
  - id: r30
    type: textarea
    text: 'Hier können Sie darstellen, welche Störungen/ Krankheiten Sie außerdem bei sich vermuten (und Sie können begründen, warum Sie dies vermuten):'
  - id: r31
    type: yesno
    text: Vermuten Sie, dass einige Störungen/ Krankheiten, die bei Ihnen bereits diagnostiziert wurden, eigentlich Falschdiagnosen sind?
  - id: r32
    type: textarea
    text: 'Hier können Sie darstellen, welche bei Ihnen diagnostizierten Störungen/ Krankheiten aus Ihrer Sicht vermutlich Falschdiagnosen sind (und Sie können auch begründen, warum Sie dies vermuten):'
  - id: r33
    type: yesno
    text: Fühlen Sie sich von anderen Personen öfters missverstanden?
  - id: r34
    type: textarea
    text: 'Hier können Sie weitere Angaben dazu machen, ob/ inwiefern Sie sich missverstanden fühlen (z. B. wann, wo und in welcher Art):'
  - id: r35
    type: yesno
    text: Haben Sie während Ihrer Schulzeit, Ihrer Ausbildung, Ihres Studiums, Ihrer Arbeitstätigkeit oder in einem anderen Kontext Mobbing erfahren?
  - id: r36
    type: textarea
    text: 'Hier können Sie Anmerkungen zu Ihren Mobbingerfahrungen verfassen:'
  - id: r37
    type: yesno
    text: Haben Sie einen Schulabschluss?
  - id: r38
    type: textarea
    text: 'Hier können Sie Anmerkungen zum Vorliegen/ Nicht-Vorliegen eines Schulabschlusses verfassen:'
  - id: r39
    type: yesno
    text: Haben Sie eine abgeschlossene Berufsausbildung?
  - id: r40
    type: textarea
    text: 'Hier können Sie Anmerkungen zum Vorliegen/ Nicht-Vorliegen einer abgeschlossenen Berufsausbildung verfassen:'
  - id: r41
    type: yesno
    text: Haben Sie ein Studium abgeschlossen?
  - id: r42
    type: textarea
    text: 'Hier können Sie Anmerkungen zum Vorliegen/ Nicht-Vorliegen eines abgeschlossenen Studiums verfassen:'
  - id: r43
    type: yesno
    text: Sind Sie mit Ihrem bisherigen Bildungsweg zufrieden?
  - id: r44
    type: textarea
    text: 'Hier können Sie weitere Anmerkungen zu Ihrem Bildungsweg verfassen:'
  - id: r45
    type: yesno
    text: Gehen Sie aktuell einem Beruf nach? (Bei Arbeitslosigkeit, Rente o. Ä. kreuzen Sie bitte „Nein“ an.)
  - id: r46
    type: textarea
    text: 'Hier können Sie Ihre berufliche Situation näher erläutern (ggf. auch Aspekte aus Ihrer Vergangenheit darstellen oder beschreiben, was einer Berufsausübung im Weg steht):'
  - id: r47
    type: yesno
    text: Gibt es in Ihrer Familie mindestens eine Person mit einer gesicherten ADHS-Diagnose?
  - id: r48
    type: yesno
    text: Gibt es in Ihrer Familie Personen, bei denen Sie ADHS vermuten?
  - id: r49
    type: textarea
    text: 'Falls Sie noch etwas zu Ihrer Familie erwähnen möchten, können Sie dies hier tun:'
  - id: r50
    type: yesno
    text: Trinken Sie regelmäßig oder gelegentlich Alkohol?
  - id: r51
    type: textarea
    text: 'Falls Ihre Antwort „Ja“ lautet, beschreiben Sie bitte Ihren Alkoholkonsum:'
  - id: r52
    type: yesno
    text: Konsumieren Sie regelmäßig oder gelegentlich Cannabis?
  - id: r53
    type: textarea
    text: 'Falls Ihre Antwort „Ja“ lautet, beschreiben Sie bitte Ihren Cannabiskonsum:'
  - id: r54
    type: yesno
    text: Rauchen Sie regelmäßig oder gelegentlich? (z. B. Zigaretten, Vapes etc.)
  - id: r55
    type: textarea
    text: 'Falls Ihre Antwort „Ja“ lautet, beschreiben Sie bitte Ihren Konsum:'
  - id: r56
    type: yesno
    text: Konsumieren Sie regelmäßig andere Drogen? (z. B. LSD, MDMA, Ecstasy, Opium, Psilocybin, Tilidin, berauschende Pilze, Kokain, Ketamin, Heroin, Lachgas, Crystal, Phenibut, Speed, Poppers, Kratom, DMT)
  - id: r57
    type: textarea
    text: 'Falls Ihre Antwort „Ja“ lautet, beschreiben Sie bitte Ihren Drogenkonsum:'
  - id: r58
    type: yesno
    text: Nehmen Sie regelmäßig Medikamente ein?
  - id: r59
    type: textarea
    text: 'Falls Ihre Antwort „Ja“ lautet, listen Sie bitte auf, welche Medikamente Sie in welcher Dosis nehmen:'
  - id: r60
    type: textarea
    text: 'Bitte beschreiben Sie grundlegend Ihre Ernährung (z. B., ob Sie sich vegetarisch/ vegan ernähren; thematisieren Sie auch, ob Sie sich einseitig ernähren):'
  - id: r61
    type: textarea
    text: 'Insofern Sie etwas Grundlegendes zu Ihrer Person mitteilen möchten, das Sie bisher nicht mitgeteilt haben, können Sie dies an dieser Stelle tun:'
  - id: r62
    type: textarea
    text: 'Falls es etwas gibt, das Ihnen sehr wichtig ist und das Sie während einer Diagnostik auf jeden Fall sagen oder fragen möchten, können Sie dies an dieser Stelle notieren:'
- id: unaufmerksamkeit
  title: 'Kapitel 3.1: Unaufmerksamkeit/ Probleme mit dem Fokus'
  description: ADHS kann von Einzelfall zu Einzelfall sehr verschieden aussehen. Allerdings müssen alle Personen mit ADHS die notwendigen Diagnosekriterien erfüllen. In diesem Kapitel geht es daher um Auffälligkeiten, die für Menschen mit ADHS charakteristisch sind.
  questions:
  - id: u1
    type: yesno
    text: Passiert es gelegentlich, dass Ihre eigenen Gedanken Sie ablenken (z. B. in Gesprächen oder beim Ausführen von Arbeitsaufgaben)?
  - id: u2
    type: textarea
    text: 'Hier können Sie genauer beschreiben, inwiefern dies vorkommt (stellen Sie ggf. dar, inwieweit dies im Arbeitsleben/ im Bildungskontext für Probleme gesorgt hat):'
  - id: u3
    type: yesno
    text: Versanken Sie in Ihrer <u>Kindheit/ Jugend</u> häufig in Tagträumen und bekamen dann von der Welt um Sie herum kaum noch etwas mit?
  - id: u4
    type: textarea
    text: 'Hier können Sie Anmerkungen zu ebendieser Tendenz verfassen:'
  - id: u5
    type: yesno
    text: Versinken Sie <u>heutzutage</u> regelmäßig in Tagträumen und bekommen dann von der Welt um Sie herum kaum noch etwas mit?
  - id: u6
    type: textarea
    text: 'Hier können Sie Anmerkungen zu ebendieser Tendenz verfassen (beschreiben Sie ggf., inwiefern dies heute Ihr Leben beeinträchtigt):'
  - id: u7
    type: yesno
    text: 'Sind Sie manchmal (z. B. für Stunden, Tage oder wenige Wochen) plötzlich von einem Thema/ einem Hobby sehr begeistert, verlieren dann aber wieder das Interesse? (Beispiel: Auf einmal interessieren Sie sich für Aquarellmalen. Sie kaufen sich daher alle Materialien und malen für eine gewisse Zeit ununterbrochen. Doch irgendwann liegt das Material nur noch ungenutzt herum.)'
  - id: u8
    type: textarea
    text: 'Hier können Sie genauer beschreiben, inwiefern dies vorkommt:'
  - id: u9
    type: yesno
    text: 'Fällt es Ihnen schwer, in der Art Blickkontakt zu halten, wie er von anderen Personen gewünscht oder als angemessen empfunden wird? (Konkretisierung: Bestehen diese Defizite insbesondere, weil schon kleine Reize Sie ablenken bzw. Ihr Fokus ständig umherspringt?)'
  - id: u10
    type: textarea
    text: 'Hier können Sie Anmerkungen zum Thema Blickkontakt verfassen:'
  - id: u11
    type: yesno
    text: 'Neigen Sie dazu, längere Texte (z. B. Anleitungen, Zeitungsartikel, Bücher) eher zu überfliegen, als Wort für Wort zu lesen? (Alternative Formulierung: Überspringen Sie beim Lesen regelmäßig Wörter oder sogar ganze Sätze?)'
  - id: u12
    type: textarea
    text: 'Hier können Sie Ihr Leseverhalten beschreiben:'
  - id: u13
    type: yesno
    text: Unterlaufen Ihnen beim Schreiben oft Fehler? (z. B., weil Sie einzelne Buchstaben oder ganze Wörter vergessen?)
  - id: u14
    type: textarea
    text: 'Hier können Sie genauer beschreiben, welche Fehler Ihnen beim Schreiben gehäuft unterlaufen:'
  - id: u15
    type: yesno
    text: 'Passiert es regelmäßig, dass andere Personen die Texte, die Sie schreiben, nicht verstehen, weil Sie Informationen zu erwähnen vergessen oder „der rote Faden verloren geht“? (Anmerkung: Denken Sie auch an Chats oder Textnachrichten.)'
  - id: u16
    type: textarea
    text: 'Hier können Sie genauer beschreiben, inwiefern Sie Probleme beim Verfassen von (verständlichen) Texten haben:'
  - id: u17
    type: yesno
    text: 'Fällt es Ihnen schwer, einem Gespräch über längere Zeit hinweg zu folgen? (Alternativ: Schweifen Ihre Gedanken regelmäßig ab, wenn Ihnen eine andere Person etwas erzählt?)'
  - id: u18
    type: textarea
    text: 'Hier können Sie genauer beschreiben, inwiefern Sie solche Defizite erleben:'
  - id: u19
    type: yesno
    text: 'Kommt es vor, dass Sie Aufgaben nicht korrekt ausführen/ Anweisungen nicht korrekt befolgen, weil Sie nicht ausreichend aufmerksam zugehört haben? (Alternativ: Hören Sie anderen Personen manchmal nicht bis zum Ende zu, was dann zu Missverständnissen führt?)'
  - id: u20
    type: textarea
    text: 'Hier können Sie genauer beschreiben, inwiefern dies bei Ihnen vorkommt:'
  - id: u21
    type: yesno
    text: Verlieren/ verlegen Sie oft Gegenstände? (z. B. Schlüssel, USB-Sticks oder Ihr Smartphone)
  - id: u22
    type: textarea
    text: 'Hier können Sie genauer beschreiben, inwiefern dies vorkommt:'
  - id: u23
    type: yesno
    text: Vergessen/ verpassen Sie Termine, Verabredungen oder sonstige Pflichten?
  - id: u24
    type: textarea
    text: 'Hier können Sie genauer beschreiben, inwiefern dies vorkommt:'
  - id: u25
    type: yesno
    text: Kommt es vor, dass Sie – wenn Sie auf eine Frage antworten – im Laufe der Antwort das Thema wechseln, sodass Sie schließlich über etwas sprechen, das mit der eigentlichen Frage nichts mehr zu tun hat?
  - id: u26
    type: textarea
    text: 'Hier können Sie genauer beschreiben, inwiefern dies vorkommt:'
  - id: u27
    type: yesno
    text: Schreiben Sie Einkaufszettel, vergessen diese aber regelmäßig zu Hause?
  - id: u28
    type: textarea
    text: 'Hier können Sie genauer beschreiben, inwiefern dies vorkommt:'
  - id: u29
    type: yesno
    text: Verleihen Sie Dinge und vergessen später, an wen Sie etwas verliehen haben?
  - id: u30
    type: textarea
    text: 'Hier können Sie genauer beschreiben, inwiefern dies vorkommt:'
  - id: u31
    type: yesno
    text: 'Schießen Ihnen selbst bei wichtigen Anlässen Gedanken in den Kopf, die Sie ablenken und dann vereinnahmen? (Beispiel: In einer Klausur denken Sie plötzlich ununterbrochen an ein Lied, anstatt die Klausur zu bearbeiten.)'
  - id: u32
    type: textarea
    text: 'Hier können Sie genauer beschreiben, inwiefern dies vorkommt:'
  - id: u33
    type: yesno
    text: Ist es in Ihrer Schulzeit vorgekommen, dass Sie eine Klausur/ Klassenarbeit mit nach Hause genommen haben, anstatt sie abzugeben?
  - id: u34
    type: textarea
    text: 'Hier können Sie genauer beschreiben, inwiefern dies vorgekommen ist:'
  - id: u35
    type: yesno
    text: Entgehen Ihnen in Gesprächen zuweilen die körperlichen Reaktionen (Gestik/ Mimik) von anderen Personen, weil Sie von Reizen aus der Umwelt oder Ihren eigenen Gedanken abgelenkt sind?
  - id: u36
    type: textarea
    text: 'Hier können Sie genauer beschreiben, inwiefern dies vorkommt:'
  - id: u37
    type: yesno
    text: 'Übersehen Sie häufig wichtige Details? (z. B.: Sie sollen eine Bewerbung als PDF einreichen, geben sie aber in einem anderen Dateiformat ab; Sie nutzen falsche E-Mail-Adressen zur Kontaktaufnahme etc.)'
  - id: u38
    type: textarea
    text: 'Hier können Sie genauer beschreiben, inwiefern dies vorkommt:'
  - id: u39
    type: yesno
    text: Schweifen Ihre Gedanken bei Lehrvorträgen (z. B. Vorlesungen, Seminaren, Weiterbildungen) schnell ab?
  - id: u40
    type: textarea
    text: 'Hier können Sie genauer beschreiben, inwiefern dies vorkommt:'
  - id: u41
    type: yesno
    text: Wollen Sie manchmal „nur kurz“ etwas am Handy erledigen (z. B. jemanden anrufen), vergessen dann aber das, was Sie eigentlich machen wollten, und swipen stattdessen durch Social Media (TikTok, YouTube, Instagram o. Ä.) oder versinken in irgendeinem Spiel? (Ja = irgendetwas in dieser Art kommt vor.)
  - id: u42
    type: textarea
    text: 'Hier können Sie genauer beschreiben, inwiefern dies vorkommt:'
  - id: u43
    type: yesno
    text: 'Vergessen Sie bei E-Mails regelmäßig, die notwendigen Anlagen anzuhängen? (Alternativ: Vergessen Sie in E-Mails manchmal wichtige Details und müssen daher noch eine E-Mail hinterhersenden?)'
  - id: u44
    type: textarea
    text: 'Hier können Sie genauer beschreiben, inwiefern dies vorkommt:'
  - id: u45
    type: yesno
    text: 'Vergessen Sie regelmäßig Arbeitsmaterial zu Hause? (Beispiel: Sind Sie früher ohne Schultasche in die Schule gegangen?)'
  - id: u46
    type: textarea
    text: 'Hier können Sie genauer beschreiben, inwiefern dies vorkommt/ vorkam:'
  - id: u47
    type: yesno
    text: Passiert es, dass Sie bei E-Mails oder Briefen nur auf einige Teile der Anfrage reagieren (weil Sie den Rest schlicht übersehen/ vergessen)?
  - id: u48
    type: textarea
    text: 'Hier können Sie genauer beschreiben, inwiefern dies vorkommt:'
  - id: u49
    type: yesno
    text: 'Versprechen Sie sich häufig? (Gemeint ist beispielsweise: Sie wissen in einer mündlichen Prüfung die Antwort, driften aber mit den Gedanken auf einmal ab, sodass Sie irgendetwas ganz anderes sagen; ggf. auch ein falsches Wort.)'
  - id: u50
    type: textarea
    text: 'Hier können Sie genauer beschreiben, inwiefern dies vorkommt (nennen Sie gerne eine konkrete Beispielsituation aus Ihrem Leben):'
  - id: u51
    type: yesno
    text: 'Gehen Sie einkaufen, um etwas Bestimmtes zu besorgen, kommen dann aber mit etwas anderem zurück? (Beispiel: Sie brauchen Gemüse für eine Suppe und fahren deshalb zum Supermarkt. Dort kaufen Sie allerdings Schokolade. Sobald Sie wieder zu Hause sind, fällt Ihnen auf, dass Sie das Gemüse vergessen haben.)'
  - id: u52
    type: textarea
    text: 'Hier können Sie genauer beschreiben, inwiefern dies vorkommt:'
  - id: u53
    type: yesno
    text: Kaufen oder bestellen Sie (z. B. im Internet) regelmäßig etwas, das Sie schon besitzen, weil Sie vergessen, dass Sie es bereits haben?
  - id: u54
    type: textarea
    text: 'Hier können Sie genauer beschreiben, inwiefern dies vorkommt (ggf. können Sie gerne eine Beispielsituation aus Ihrem Leben darstellen):'
  - id: u55
    type: yesno
    text: Ziehen Sie Kleidungsstücke gelegentlich verkehrt herum an?
  - id: u56
    type: textarea
    text: 'Hier können Sie genauer beschreiben, inwiefern dies vorkommt:'
  - id: u57
    type: yesno
    text: 'Unterlaufen Ihnen bei Überweisungen Flüchtigkeitsfehler? (z. B.: Überweisungen an falsche Personen; falsche Beträge; Tippfehler im Verwendungszweck?)'
  - id: u58
    type: textarea
    text: 'Hier können Sie genauer beschreiben, inwiefern dies vorkommt (es bietet sich an, ggf. eine Beispielsituation aus Ihrem Leben zu beschreiben):'
  - id: u59
    type: yesno
    text: Kommt es vor, dass Sie vergessen, Briefe (z. B. an Ämter) abzuschicken?
  - id: u60
    type: textarea
    text: 'Hier können Sie genauer beschreiben, inwiefern dies vorkommt:'
  - id: u61
    type: yesno
    text: 'Verlieren Sie sich regelmäßig in bestimmten Tätigkeiten (z. B. beim Zocken von Computer-Games) und vergessen Sie dann die Zeit? (Stichwort: Hyperfokus)'
  - id: u62
    type: textarea
    text: 'Hier können Sie genauer beschreiben, inwiefern dies vorkommt:'
  - id: u63
    type: yesno
    text: Kritisieren andere Personen Sie regelmäßig dafür, dass Sie ihnen nicht richtig zuhören würden?
  - id: u64
    type: textarea
    text: 'Hier können Sie genauer beschreiben, inwiefern dies vorkommt:'
  - id: u65
    type: yesno
    text: Lassen Sie sich beim Lernen, bei Haushaltsarbeiten oder anderen (wichtigen) Aktivitäten schnell ablenken? (z. B. von Social Media, Textnachrichten, Games)
  - id: u66
    type: textarea
    text: 'Hier können Sie genauer beschreiben, inwiefern dies vorkommt:'
  - id: u67
    type: yesno
    text: Geraten Sie bei komplexeren Aufgaben häufig durcheinander oder unterlaufen Ihnen dabei Fehler? (z. B. beim Kochen/ Backen oder Wäschewaschen)
  - id: u68
    type: textarea
    text: 'Hier können Sie genauer beschreiben, inwiefern dies vorkommt:'
  - id: u69
    type: yesno
    text: 'Falls Sie einen Führerschein haben: Übersehen Sie regelmäßig Verkehrsschilder oder Rechts-vor-links-Situationen? (Alternativ: Verfahren Sie sich regelmäßig?)'
  - id: u70
    type: textarea
    text: 'Hier können Sie genauer beschreiben, inwiefern dies vorkommt:'
  - id: u71
    type: yesno
    text: Gelingt es Ihnen besser, sich auf eine freiwillige Aktivität mit einem unmittelbaren Belohnungssystem (z. B. ein Computer-Game) zu konzentrieren als auf ein wichtiges To-do, das zwingend erledigt werden muss (z. B. die Steuererklärung)?
  - id: u72
    type: textarea
    text: 'Hier können Sie genauer beschreiben, inwiefern dies vorkommt:'
  - id: u73
    type: yesno
    text: 'Haben Sie Probleme mit dem Zeitmanagement? (z. B.: Sie kommen unpünktlich zu Terminen/ Verabredungen bzw. schätzen die Zeit, die Sie für etwas benötigen werden, falsch ein. Oder: Sie wissen um Ihre Schwierigkeiten mit dem Zeitempfinden und haben sich deshalb angewöhnt, vor einem wichtigen Termin nichts zu tun, außer abzuwarten. Dazu kann gehören, dass Sie viel früher zu Terminen erscheinen und vor Ort warten, um bloß nicht zu spät zu kommen.)'
  - id: u74
    type: textarea
    text: 'Hier können Sie beschreiben, inwiefern dies vorkommt (beschreiben Sie ggf. eine konkrete Situation aus Ihrem Leben):'
- id: kreativer-zwischenhalt
  title: 'Kapitel 3.2: Kreativer Zwischenhalt'
  description: Viele Menschen mit ADHS fallen durch ihre unkonventionellen Ideen und ihre Fähigkeit zur Improvisation auf. Im gedruckten Buch findet sich an dieser Stelle ein Bild zum freien Bearbeiten/ Ergänzen (Superhelden-Szene). Da sich eine Zeichnung nicht in dieses digitale Formular übertragen lässt, können Sie hier stattdessen Ihre Ideen dazu notieren.
  questions:
  - id: k1
    type: textarea
    text: 'Ihre Ideen/ Notizen zu diesem kreativen Zwischenhalt (z. B. wie Sie die Szene mit den Superhelden Superball, Sternchen und Super-Ei sowie dem Widersacher Todes-Ei weiterspinnen würden):'
- id: impulsivitaet-hyperaktivitaet
  title: 'Kapitel 3.3: Impulsivität/ Hyperaktivität'
  description: ''
  questions:
  - id: i1
    type: yesno
    text: Wackeln Sie beim Sitzen häufig mit den Beinen oder rutschen Sie auf dem Stuhl umher oder tun Sie irgendetwas mit Ihren Händen nebenbei? (Für „Ja“ reicht es, wenn Sie eine dieser Tätigkeiten oder eine ähnliche Tätigkeit häufig ausführen.)
  - id: i2
    type: textarea
    text: 'Hier können Sie genauere Angaben zur Frage machen:'
  - id: i3
    type: yesno
    text: 'Fällt es Ihnen schwer, über eine längere Zeit hinweg ruhig sitzen zu bleiben? (Gemeint ist: wirklich ruhig zu sitzen – wortwörtlich.)'
  - id: i4
    type: textarea
    text: 'Hier können Sie genauere Angaben zur Frage machen:'
  - id: i5
    type: yesno
    text: Verspüren Sie regelmäßig einen inneren Bewegungsdrang?
  - id: i6
    type: textarea
    text: 'Hier können Sie genauere Angaben zur Frage machen:'
  - id: i7
    type: yesno
    text: Überschlagen sich manchmal in Ihrem Kopf die Gedanken derart, dass Sie gelähmt sind und gar nichts mehr tun können?
  - id: i8
    type: textarea
    text: 'Hier können Sie genauere Angaben zur Frage machen (z. B., ob dies insbesondere in ruhigen Momenten so ist):'
  - id: i9
    type: yesno
    text: Leiden Sie gelegentlich an der Rasanz oder am Umfang Ihrer eigenen Gedanken? (z. B., weil Sie selbst merken, dass Sie dadurch nicht geordnet auf ein Ziel „hindenken“ können?)
  - id: i10
    type: textarea
    text: 'Hier können Sie genauere Angaben zur Frage machen:'
  - id: i11
    type: yesno
    text: Reden Sie zuweilen so viel, dass andere Personen nicht zu Wort kommen?
  - id: i12
    type: textarea
    text: 'Hier können Sie genauere Angaben zur Frage machen:'
  - id: i13
    type: yesno
    text: Fallen Sie in Gesprächen anderen Personen ins Wort?
  - id: i14
    type: textarea
    text: 'Hier können Sie genauere Angaben zur Frage machen:'
  - id: i15
    type: yesno
    text: Fällt es Ihnen bei Gesellschaftsspielen schwer, zu warten, bis Sie an der Reihe sind?
  - id: i16
    type: textarea
    text: 'Hier können Sie genauere Angaben zur Frage machen:'
  - id: i17
    type: yesno
    text: Treffen Sie manchmal wichtige Entscheidungen, ohne alle Konsequenzen zu durchdenken?
  - id: i18
    type: textarea
    text: 'Hier können Sie genauere Angaben zur Frage machen (beschreiben Sie gerne eine konkrete Situation aus Ihrem Leben):'
  - id: i19
    type: yesno
    text: 'Fällt Ihnen zuweilen das Einschlafen schwer, weil die Gedanken in Ihrem Kopf nicht zu kreisen aufhören/ nicht zur Ruhe kommen? (Alternativ: Liegen Sie deshalb stundenlang wach? Stichwort: Overthinking.)'
  - id: i20
    type: textarea
    text: 'Hier können Sie genauere Angaben zur Frage machen:'
  - id: i21
    type: yesno
    text: 'Lassen Sie sich von Werbung schnell beeinflussen? (Alternativ: Kaufen Sie manchmal etwas spontan, weil Sie es niedlich/ interessant finden, obwohl Sie es am Ende gar nicht benutzen und es dann nur rumliegt?)'
  - id: i22
    type: textarea
    text: 'Hier können Sie genauere Angaben zur Frage machen:'
  - id: i23
    type: yesno
    text: Können Sie Geheimnisse gut für sich behalten bzw. plaudern Sie Geheimnisse niemals versehentlich aus?
  - id: i24
    type: textarea
    text: 'Hier können Sie genauere Angaben zur Frage machen:'
  - id: i25
    type: yesno
    text: Verletzen Sie manchmal die Gefühle anderer Menschen, weil Sie reden, bevor Sie (gründlich) nachdenken?
  - id: i26
    type: textarea
    text: 'Hier können Sie genauere Angaben zur Frage machen:'
  - id: i27
    type: yesno
    text: Neigen Sie dazu, im Straßenverkehr zu schnell zu fahren?
  - id: i28
    type: textarea
    text: 'Hier können Sie genauere Angaben zur Frage machen:'
  - id: i29
    type: yesno
    text: Erzählen Sie in unangenehmen Situationen manchmal spontan (schlechte) Lügen, die Sie dann regelmäßig in noch größere Probleme bringen?
  - id: i30
    type: textarea
    text: 'Hier können Sie genauere Angaben zur Frage machen:'
  - id: i31
    type: yesno
    text: Verlieren Sie (gelegentlich) die Beherrschung/ Kontrolle über sich selbst und werden schnell wütend/ rasten schnell aus?
  - id: i32
    type: textarea
    text: 'Hier können Sie genauere Angaben zur Frage machen:'
  - id: i33
    type: yesno
    text: Haben Sie in der Schulzeit/ im Studium/ bei der Ausbildung/ bei Weiterbildungen häufig dazwischengerufen, also etwas gesagt, ohne sich ordnungsgemäß zu Wort zu melden (oder tun Sie dies noch immer)?
  - id: i34
    type: textarea
    text: 'Hier können Sie genauere Angaben zur Frage machen:'
  - id: i35
    type: yesno
    text: 'Müssen Sie beim Arbeiten, beim Lernen, beim Telefonieren oder bei anderen Aktivitäten herumlaufen? (Alternativ: Brauchen Sie für tendenziell monotone Tätigkeiten wie z. B. Lesen, Putzen etc. zusätzliche Reize wie z. B. Musik/ einen Film im Hintergrund, damit Sie überhaupt handlungsfähig sind?)'
  - id: i36
    type: textarea
    text: 'Hier können Sie genauere Angaben zur Frage machen:'
  - id: i37
    type: yesno
    text: Schicken Sie E-Mails, Briefe oder Textnachrichten ab, ohne sie Korrektur zu lesen, sodass 1) Sie teilweise bereuen, was Sie geschrieben haben, oder 2) Sie im Nachgang Korrekturen/ Bearbeitungen vornehmen müssen?
  - id: i38
    type: textarea
    text: 'Hier können Sie genauere Angaben zur Frage machen:'
  - id: i39
    type: yesno
    text: 'Haben Sie zentrale Lebensentscheidungen spontan getroffen (z. B. hinsichtlich Ausbildungsweg oder Studienfach), was zu Brüchen in Ihrem Lebenslauf geführt hat? (z. B.: Sie haben sich an einer Universität spontan für Biologie eingeschrieben, aber dann schnell bemerkt, dass Sie das Thema eigentlich nicht interessiert.)'
  - id: i40
    type: textarea
    text: 'Hier können Sie genauere Angaben zur Frage machen:'
  - id: i41
    type: yesno
    text: 'Haben Sie Probleme, mit Geld zukunftsorientiert umzugehen? (Alternativ: Kaufen Sie häufig etwas aufgrund eines inneren Impulses, obwohl Ihnen aktuell kein Geld zur Verfügung steht? Stichwort: Schulden.)'
  - id: i42
    type: textarea
    text: 'Hier können Sie genauere Angaben zur Frage machen (beschreiben Sie gerne eine konkrete Situation aus Ihrem Leben):'
  - id: i43
    type: yesno
    text: 'Haben Sie Probleme, Ihre Gefühle zu regulieren? (z. B.: Wenn Sie etwas aufregt oder Sie etwas für unfair halten, fällt es Ihnen schwer, zu schweigen.)'
  - id: i44
    type: textarea
    text: 'Hier können Sie genauere Angaben zur Frage machen:'
  - id: i45
    type: yesno
    text: 'Neigen Sie dazu, spontan etwas Verbotenes zu tun? (z. B.: Einer Person fallen 50 Euro aus der Tasche; weil die Person davon nichts mitbekommt, geht sie einfach weiter und biegt in eine Seitengasse ab. Daraufhin nehmen Sie die 50 Euro an sich – zu Hause angekommen, denken Sie aber, dass Sie das nicht hätten tun sollen.)'
  - id: i46
    type: textarea
    text: 'Hier können Sie genauere Angaben zur Frage machen:'
  - id: i47
    type: yesno
    text: Sprechen Sie spontan neue Leute an? (z. B., wenn Sie mit öffentlichen Verkehrsmitteln unterwegs sind oder an einer Fortbildung teilnehmen.)
  - id: i48
    type: textarea
    text: 'Hier können Sie genauere Angaben zur Frage machen:'
  - id: i49
    type: yesno
    text: Neigen Sie dazu, bei Lieferverzögerungen extrem ungeduldig zu werden?
  - id: i50
    type: textarea
    text: 'Hier können Sie genauere Angaben zur Frage machen:'
  - id: i51
    type: yesno
    text: Schwankt Ihre Stimmung häufig und/ oder schnell?
  - id: i52
    type: textarea
    text: 'Hier können Sie genauere Angaben zur Frage machen:'
  - id: i53
    type: yesno
    text: 'Riskieren Sie lieber, alles fallen zu lassen, als zweimal zu gehen? (Beispiel: Sie müssen mehrere Tassen von der Küche ins Wohnzimmer tragen. „Ja“ bedeutet: Sie würden eher alle Tassen auf einmal nehmen, obwohl das eigentlich zu viel ist und deshalb die Gefahr besteht, dass alles zu Bruch gehen könnte.)'
  - id: i54
    type: textarea
    text: 'Hier können Sie genauere Angaben zur Frage machen:'
  - id: i55
    type: yesno
    text: 'Werden Sie zuweilen aggressiv (verbal oder physisch), wenn Ihnen etwas nicht sofort gelingt? (z. B.: Sie müssen bei einer Reparaturarbeit zwei Gegenstände zusammenbinden, aber einer der Gegenstände fällt Ihnen plötzlich zu Boden.)'
  - id: i56
    type: textarea
    text: 'Hier können Sie genauere Angaben zur Frage machen:'
  - id: i57
    type: yesno
    text: Haben Sie schon mehrfach den Ausbildungsweg, das Studienfach oder den Job gewechselt, weil Ihnen langweilig geworden ist?
  - id: i58
    type: textarea
    text: 'Hier können Sie genauere Angaben zur Frage machen (beschreiben Sie ggf. eine konkrete Situation aus Ihrem Leben):'
  - id: i59
    type: yesno
    text: 'Haben Sie in der Schule, im Studium oder in ähnlichen Situationen ständig mit anderen Personen geredet, anstatt sich auf den Unterricht zu konzentrieren? (Alternativ: Ist das heute noch immer so, z. B. auf der Arbeit?)'
  - id: i60
    type: textarea
    text: 'Hier können Sie genauere Angaben zur Frage machen:'
- id: weitere-auffaelligkeiten
  title: 'Kapitel 4: Weitere Auffälligkeiten mit Bezug zu ADHS'
  description: Die in diesem Kapitel thematisierten Auffälligkeiten stellen teilweise keine direkten Diagnosekriterien für ADHS dar. Sie hängen allerdings mit typischen ADHS-Merkmalen zusammen oder werden regelmäßig mit ADHS in Verbindung gebracht.
  questions:
  - id: w1
    type: yesno
    text: 'Haben Sie das Gefühl, dass Reize (z. B. Lichter, Geräusche, Gerüche) ungefiltert auf Sie einwirken? (Alternativ: Springt Ihr Aufmerksamkeitsfokus derart schnell umher, dass Sie quasi alles gleichzeitig wahrnehmen?)'
  - id: w2
    type: textarea
    text: 'Hier können Sie die von Ihnen wahrgenommenen Schwierigkeiten bei der Reizverarbeitung genauer beschreiben (z. B., inwiefern Sie das Gefühl haben, dass Ihr Fokus ständig springt):'
  - id: w3
    type: yesno
    text: Bekommen Sie Kopfschmerzen/ fangen Sie an zu zittern o. Ä., wenn zu viele Reize auf Sie einwirken und/ oder diese Reize zu intensiv sind? (= Erleiden Sie in solchen Situationen eine Reizüberflutung bzw. einen Overload?)
  - id: w4
    type: textarea
    text: 'Hier können Sie Anmerkungen zu Ihrem Erleben von Overloads notieren:'
  - id: w5
    type: yesno
    text: Kommt es vor, dass Sie 1) aggressiv werden (verbal oder körperlich), 2) weglaufen oder 3) erstarren, wenn zu viele Reize auf Sie einwirken und/ oder diese Reize zu intensiv sind? (= Erleiden Sie in solchen Situationen einen Meltdown?)
  - id: w6
    type: textarea
    text: 'Hier können Sie Anmerkungen zu Ihrem Erleben von Meltdowns notieren:'
  - id: w7
    type: yesno
    text: Kommt es vor, 1) dass Sie nicht mehr sprechen können, 2) dass Sie zusammenbrechen oder 3) dass Sie sich (wippend) in Embryonalstellung begeben, wenn zu viele Reize auf Sie einwirken und/ oder diese Reize zu intensiv sind? (= Erleiden Sie in solchen Situationen einen Shutdown?)
  - id: w8
    type: textarea
    text: 'Hier können Sie Anmerkungen zu Ihrem Erleben von Shutdowns notieren:'
  - id: w9
    type: yesno
    text: 'Fühlen Sie sich bei Kritik oder Ablehnung schnell verletzt oder gekränkt? (Alternativ: Reagieren Sie auf Kritik meistens bzw. automatisch abweisend – selbst wenn die Kritik berechtigt sein könnte oder konstruktiv ist?)'
  - id: w10
    type: textarea
    text: 'Hier können Sie genauere Angaben zur Frage machen:'
  - id: w11
    type: yesno
    text: Zerbrechen Freundschaften immer wieder, weil Sie anderen Personen angeblich „zu anstrengend“ sind?
  - id: w12
    type: textarea
    text: 'Hier können Sie genauere Angaben zur Frage machen:'
  - id: w13
    type: yesno
    text: Beginnen Sie erst kurz vor der Abgabefrist mit der Bearbeitung von wichtigen Aufgaben?
  - id: w14
    type: textarea
    text: 'Hier können Sie genauere Angaben zur Frage machen:'
  - id: w15
    type: yesno
    text: 'Wenden Sie oft sehr viel Zeit auf, um Aktivitäten zu planen sowie zu strukturieren, halten sich dann aber weder an die Pläne noch an die Strukturen? (z. B.: Sie kaufen sich Alltagsplaner, um eine Tagesstruktur/ Arbeitsroutine zu entwickeln. Später halten Sie sich jedoch nicht an diesen Plan und er bleibt ungenutzt.)'
  - id: w16
    type: textarea
    text: 'Hier können Sie genauere Angaben zur Frage machen:'
  - id: w17
    type: yesno
